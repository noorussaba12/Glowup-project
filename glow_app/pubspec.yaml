name: glow
description: "Glow - AI Skin Health App (Personalized Skincare & Nutrition Plan)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Firebase Core & Services
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0

  # Local Storage & Preferences
  shared_preferences: ^2.2.3

  # Camera & Vision
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  google_mlkit_face_detection: ^0.11.0

  # Networking & HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # PDF Report Export & Sharing
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
